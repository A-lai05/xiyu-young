<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戏屿青年 - 登录注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f7f8fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 920px;
            display: flex;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.08);
        }
        .card-left {
            width: 40%;
            background-color: #7c3aed;
            color: #fff;
            padding: 60px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .avatar-circle {
            width: 110px;
            height: 110px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .card-left h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .card-left .sub-title {
            font-size: 15px;
            opacity: 0.9;
            margin-bottom: 36px;
        }
        .platform-desc {
            text-align: left;
            width: 100%;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
        }
        .platform-desc h4 {
            margin-bottom: 12px;
            font-size: 16px;
        }
        .platform-desc p {
            font-size: 14px;
            line-height: 1.7;
            opacity: 0.95;
        }
        .card-right {
            width: 60%;
            padding: 60px 50px;
        }
        .form-wrap {
            display: none;
        }
        .form-wrap.active {
            display: block;
        }
        .form-wrap h2 {
            font-size: 26px;
            color: #1f2937;
            margin-bottom: 8px;
        }
        .form-desc {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .form-item {
            margin-bottom: 20px;
        }
        .form-item label {
            display: block;
            font-size: 14px;
            color: #374151;
            margin-bottom: 8px;
        }
        .form-item input {
            width: 100%;
            height: 48px;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 0 16px;
            font-size: 15px;
            transition: border 0.25s;
        }
        .form-item input:focus {
            outline: none;
            border-color: #7c3aed;
        }

        /* 身份选择样式 */
        .role-select {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .role-item {
            flex: 1;
            height: 44px;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .role-item.active {
            background: #7c3aed;
            color: #fff;
            border-color: #7c3aed;
        }

        .privacy-box {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 24px;
        }
        .privacy-box input {
            width: 18px;
            height: 18px;
            margin-top: 3px;
            cursor: pointer;
        }
        .privacy-box span {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .privacy-box a {
            color: #7c3aed;
            text-decoration: none;
        }
        .submit-btn {
            width: 100%;
            height: 50px;
            background-color: #7c3aed;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.25s;
        }
        .submit-btn:hover {
            background-color: #6d28d9;
        }
        .switch-tip {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #6b7280;
        }
        .switch-tip a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="card-left">
            <div class="avatar-circle" id="faceEmoji">😟</div>
            <h1>戏屿青年</h1>
            <div class="sub-title">青年话剧演员平台</div>
            <div class="platform-desc">
                <h4>平台介绍</h4>
                <p>戏屿青年面向全国青年话剧爱好者、舞台剧演员，提供作品展示、剧组招募、同行交流社区功能。你可以发布舞台动态、管理个人演出作品、报名线下话剧试镜，和万千话剧从业者交流舞台心得。</p>
            </div>
        </div>

        <div class="card-right">
            <div class="form-wrap active" id="loginForm">
                <h2>欢迎回来</h2>
                <p class="form-desc">请登录你的账号</p>
                <div class="form-item">
                    <label>用户名</label>
                    <input type="text" id="loginUser" placeholder="请输入用户名">
                </div>
                <div class="form-item">
                    <label>密码</label>
                    <input type="password" id="loginPwd" placeholder="请输入密码">
                </div>
                <div class="privacy-box">
                    <input type="checkbox" id="loginCheck">
                    <span>我已阅读并同意<a href="javascript:alert('《用户隐私政策》')">《用户隐私政策》</a>与<a href="javascript:alert('《用户服务协议》')">《用户服务协议》</a></span>
                </div>
                <button class="submit-btn" onclick="doLogin()">登录</button>
                <div class="switch-tip">没有账号？<a onclick="switchForm('reg')">去注册</a></div>
            </div>

            <div class="form-wrap" id="regForm">
                <h2>创建账号</h2>
                <p class="form-desc">加入戏屿青年话剧平台</p>
                <div class="form-item">
                    <label>用户名</label>
                    <input type="text" id="regUser" placeholder="请输入演员昵称">
                </div>
                <div class="form-item">
                    <label>密码</label>
                    <input type="password" id="regPwd" placeholder="设置登录密码">
                </div>
                <div class="form-item">
                    <label>确认密码</label>
                    <input type="password" id="regRePwd" placeholder="再次输入密码">
                </div>

                <!-- 必选：身份选择 -->
                <div class="form-item">
                    <label>选择你的身份（必选）</label>
                    <div class="role-select">
                        <div class="role-item" data-role="actor">演员</div>
                        <div class="role-item" data-role="viewer">观众</div>
                        <div class="role-item" data-role="director">导演</div>
                    </div>
                </div>

                <div class="privacy-box">
                    <input type="checkbox" id="regCheck">
                    <span>我已阅读并同意<a href="javascript:alert('《用户隐私政策》')">《用户隐私政策》</a>与<a href="javascript:alert('《用户服务协议》')">《用户服务协议》</a></span>
                </div>
                <button class="submit-btn" onclick="doRegister()">注册</button>
                <div class="switch-tip">已有账号？<a onclick="switchForm('login')">去登录</a></div>
            </div>
        </div>
    </div>

    <script>
        const faceEmoji = document.getElementById('faceEmoji');
        let selectedRole = ""; // 选中的身份

        // 切换登录/注册
        function switchForm(type) {
            document.querySelectorAll('.form-wrap').forEach(item => item.classList.remove('active'));
            if(type === 'login') {
                document.getElementById('loginForm').classList.add('active');
                faceEmoji.textContent = '😟';
            }else{
                document.getElementById('regForm').classList.add('active');
                faceEmoji.textContent = '😊';
            }
        }

        // 身份选择点击
        document.querySelectorAll('.role-item').forEach(item => {
            item.onclick = function() {
                document.querySelectorAll('.role-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                selectedRole = this.getAttribute('data-role');
            }
        });

        // ==========================
        // 登录逻辑（自动识别管理员）
        // ==========================
        function doLogin() {
            const username = document.getElementById('loginUser').value.trim();
            const pwd = document.getElementById('loginPwd').value;
            const isAgree = document.getElementById('loginCheck').checked;

            if(!isAgree) {
                faceEmoji.textContent = '😥';
                alert('请勾选同意隐私政策和用户协议后再登录');
                return;
            }
            if(!username || !pwd) {
                faceEmoji.textContent = '😥';
                alert('用户名和密码不能为空');
                return;
            }

            // =============================================
            // 【固定管理员账号】自动跳后台，不需要身份
            // =============================================
            if(username === 'admin' && pwd === 'admin123'){
                localStorage.setItem('currentUser', JSON.stringify({
                    username: '管理员',
                    role: 'admin'
                }));
                faceEmoji.textContent = '👨‍💻';
                alert('管理员登录成功！正在进入管理后台');
                location.href = '戏屿青年管理员.html';
                return;
            }

            // 普通用户登录
            const userList = JSON.parse(localStorage.getItem('xiyuUsers') || '[]');
            const targetUser = userList.find(item => item.username === username && item.password === pwd);

            if(!targetUser) {
                faceEmoji.textContent = '😵';
                alert('账号或密码错误，请重新输入');
                return;
            }

            // 登录成功，保存用户（含身份）
            localStorage.setItem('currentUser', JSON.stringify(targetUser));
            faceEmoji.textContent = '🥳';
            alert('登录成功，欢迎来到戏屿青年！');
            location.href = '戏屿青年主页面.html';
        }

        // 注册逻辑（带身份）
        function doRegister() {
            const username = document.getElementById('regUser').value.trim();
            const pwd = document.getElementById('regPwd').value;
            const rePwd = document.getElementById('regRePwd').value;
            const isAgree = document.getElementById('regCheck').checked;

            if(!isAgree) {
                faceEmoji.textContent = '😥';
                alert('请勾选同意隐私政策和用户协议后注册');
                return;
            }
            if(!username || !pwd || !rePwd) {
                faceEmoji.textContent = '😥';
                alert('请填写完整注册信息');
                return;
            }
            if(pwd !== rePwd) {
                faceEmoji.textContent = '😵';
                alert('两次输入的密码不一致');
                return;
            }
            if(!selectedRole) {
                faceEmoji.textContent = '😥';
                alert('请选择你的身份：演员/观众/导演');
                return;
            }

            const userList = JSON.parse(localStorage.getItem('xiyuUsers') || '[]');
            const repeatUser = userList.find(item => item.username === username);
            if(repeatUser) {
                faceEmoji.textContent = '😟';
                alert('该用户名已被注册，请更换昵称');
                return;
            }

            // ✅ 关键：注册时保存身份 role
            const newUser = {
                uid: Date.now(),
                username: username,
                password: pwd,
                age: "",
                playYear: "",
                intro: "",
                role: selectedRole  // actor / viewer / director
            };
            userList.push(newUser);
            localStorage.setItem('xiyuUsers', JSON.stringify(userList));

            faceEmoji.textContent = '🥳';
            alert('注册成功！请前往登录页面登录账号');
            switchForm('login');
        }

        // 表情交互
        document.getElementById('loginUser').addEventListener('input',()=>{faceEmoji.textContent='😊'});
        document.getElementById('loginPwd').addEventListener('focus',()=>{faceEmoji.textContent='😳'});
        document.getElementById('regUser').addEventListener('input',()=>{faceEmoji.textContent='😄'});
        document.getElementById('regPwd').addEventListener('focus',()=>{faceEmoji.textContent='😳'});
        document.getElementById('regRePwd').addEventListener('input',()=>{faceEmoji.textContent='🥰'});
    </script>
</body>
</html>
